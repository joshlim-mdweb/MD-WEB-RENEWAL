<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" fill="none">
  <rect width="340" height="220" fill="#2EB872"/>
  <circle cx="310" cy="210" r="90" fill="white" fill-opacity="0.07"/>
  <circle cx="20" cy="20" r="60" fill="white" fill-opacity="0.07"/>
  <!-- line chart area -->
  <polygon points="70,170 70,110 130,88 190,68 250,48 270,42 270,170" fill="white" fill-opacity="0.12"/>
  <!-- line chart -->
  <polyline points="70,110 130,88 190,68 250,48 270,42" stroke="white" stroke-opacity="0.7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- axis -->
  <line x1="70" y1="170" x2="280" y2="170" stroke="white" stroke-opacity="0.2" stroke-width="1.5"/>
  <line x1="70" y1="60" x2="70" y2="170" stroke="white" stroke-opacity="0.2" stroke-width="1.5"/>
  <!-- dots on line -->
  <circle cx="70" cy="110" r="5" fill="white" fill-opacity="0.8"/>
  <circle cx="130" cy="88" r="5" fill="white" fill-opacity="0.8"/>
  <circle cx="190" cy="68" r="5" fill="white" fill-opacity="0.8"/>
  <circle cx="250" cy="48" r="5" fill="white" fill-opacity="0.8"/>
  <circle cx="270" cy="42" r="6" fill="white"/>
  <!-- up arrow -->
  <line x1="270" y1="42" x2="298" y2="22" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <polygon points="298,22 286,22 292,34" fill="white"/>
  <!-- percentage badge -->
  <rect x="255" y="6" width="66" height="28" rx="14" fill="white" fill-opacity="0.3"/>
  <text x="288" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="white" font-family="sans-serif">+38%</text>
</svg>

  <rect x="60" y="48" width="90" height="56" rx="14" fill="white" fill-opacity="0.22"/>
  <polygon points="80,104 68,120 96,104" fill="white" fill-opacity="0.22"/>
  <!-- speech bubble right -->
  <rect x="192" y="38" width="100" height="64" rx="14" fill="white" fill-opacity="0.3"/>
  <polygon points="274,102 286,120 260,102" fill="white" fill-opacity="0.3"/>
  <!-- lines in bubbles -->
  <rect x="74" y="64" width="62" height="7" rx="4" fill="white" fill-opacity="0.5"/>
  <rect x="74" y="78" width="46" height="7" rx="4" fill="white" fill-opacity="0.5"/>
  <rect x="206" y="54" width="72" height="7" rx="4" fill="white" fill-opacity="0.5"/>
  <rect x="206" y="68" width="56" height="7" rx="4" fill="white" fill-opacity="0.5"/>
  <rect x="206" y="82" width="40" height="7" rx="4" fill="white" fill-opacity="0.5"/>
  <!-- table -->
  <rect x="80" y="162" width="180" height="14" rx="7" fill="white" fill-opacity="0.25"/>
  <!-- laptop -->
  <rect x="136" y="132" width="68" height="40" rx="6" fill="white" fill-opacity="0.3"/>
  <rect x="122" y="170" width="96" height="8" rx="4" fill="white" fill-opacity="0.2"/>
  <rect x="148" y="140" width="44" height="26" rx="3" fill="#4A6AE0" fill-opacity="0.5"/>
  <!-- person left -->
  <circle cx="108" cy="126" r="14" fill="#F4C5A8"/>
  <rect x="90" y="142" width="36" height="28" rx="10" fill="white" fill-opacity="0.35"/>
  <ellipse cx="108" cy="120" rx="10" ry="8" fill="#2D3A4A" fill-opacity="0.7"/>
  <!-- person right -->
  <circle cx="232" cy="126" r="14" fill="#F4C5A8"/>

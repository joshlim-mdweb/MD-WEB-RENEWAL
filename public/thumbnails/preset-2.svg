<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" fill="none">
  <rect width="340" height="220" fill="#4A7BD6"/>
  <circle cx="300" cy="30" r="80" fill="white" fill-opacity="0.07"/>
  <circle cx="40" cy="200" r="60" fill="white" fill-opacity="0.07"/>
  <!-- grid lines -->
  <line x1="80" y1="60" x2="80" y2="170" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="80" y1="170" x2="280" y2="170" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <!-- bars -->
  <rect x="100" y="120" width="36" height="50" rx="6" fill="white" fill-opacity="0.25"/>
  <rect x="152" y="90" width="36" height="80" rx="6" fill="white" fill-opacity="0.38"/>
  <rect x="204" y="70" width="36" height="100" rx="6" fill="white" fill-opacity="0.55"/>
  <!-- bar tops highlight -->
  <rect x="100" y="120" width="36" height="10" rx="6" fill="white" fill-opacity="0.3"/>
  <rect x="152" y="90" width="36" height="10" rx="6" fill="white" fill-opacity="0.3"/>
  <rect x="204" y="70" width="36" height="10" rx="6" fill="white" fill-opacity="0.3"/>
  <!-- trend arrow -->
  <polyline points="118,130 170,100 222,80" stroke="white" stroke-opacity="0.7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="222,80 212,78 218,88" fill="white" fill-opacity="0.7"/>
  <!-- person -->
  <circle cx="268" cy="128" r="12" fill="#F4C5A8"/>
  <rect x="254" y="142" width="28" height="30" rx="9" fill="white" fill-opacity="0.3"/>
  <ellipse cx="268" cy="122" rx="9" ry="7" fill="#2D3A4A" fill-opacity="0.7"/>
  <!-- pointer arm -->
  <line x1="254" y1="150" x2="238" y2="110" stroke="#F4C5A8" stroke-width="5" stroke-linecap="round"/>
</svg>

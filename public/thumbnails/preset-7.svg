  <circle cx="46" cy="140" r="11" fill="#F4C5A8"/>
  <ellipse cx="46" cy="135" rx="8" ry="6" fill="#2D3A4A" fill-opacity="0.6"/>
  <rect x="32" y="153" width="28" height="22" rx="9" fill="white" fill-opacity="0.22"/>
  <!-- person far right -->
  <circle cx="294" cy="140" r="11" fill="#F4C5A8"/>

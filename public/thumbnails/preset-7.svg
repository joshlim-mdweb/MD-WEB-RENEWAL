  <line x1="60" y1="155" x2="100" y2="120" stroke="white" stroke-opacity="0.15" stroke-width="2"/>
  <line x1="280" y1="155" x2="240" y2="120" stroke="white" stroke-opacity="0.15" stroke-width="2"/>
  <!-- center person -->
  <circle cx="170" cy="74" r="18" fill="#F4C5A8"/>
  <ellipse cx="170" cy="66" rx="13" ry="10" fill="#2D3A4A" fill-opacity="0.75"/>
  <rect x="148" y="94" width="44" height="32" rx="14" fill="white" fill-opacity="0.4"/>
